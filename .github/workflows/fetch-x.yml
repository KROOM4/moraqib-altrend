
name: Fetch Saudi Trends

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Google Trends Saudi Arabia
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://trends.google.com/trending/rss?geo=SA"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              root = ET.fromstring(response.read())

          channel = root.find("channel")
          if channel is None:
              raise SystemExit("Google Trends RSS has no channel")

          def child_text(element, wanted_name, default=""):
              for child in element:
                  if child.tag.split("}")[-1] == wanted_name:
                      return (child.text or "").strip()
              return default

          posts = []

          for item in channel.findall("item"):
              title = child_text(item, "title")
              if not title:
                  continue

              traffic = child_text(item, "approx_traffic")
              pub_date = child_text(item, "pubDate")
              link = child_text(item, "link", title)

              posts.append({
                  "id": link or title,
                  "text": title,
                  "created_at": pub_date,
                  "metrics": {
                      "search_volume": traffic
                  }
              })

          if not posts:
              raise SystemExit("Google Trends returned no trends")

          os.makedirs("data", exist_ok=True)

          with open("data/x-trends.json", "w", encoding="utf-8") as f:
              json.dump({
                  "updated_at": datetime.now(timezone.utc).isoformat(),
                  "source": "Google Trends",
                  "results": [{
                      "hashtag": "مواضيع رائجة في السعودية",
                      "post_count": len(posts),
                      "posts": posts
                  }]
              }, f, ensure_ascii=False, indent=2)

          print(f"Fetched {len(posts)} Google Trends topics.")
          print("Sample search volume:", posts[0]["metrics"]["search_volume"])
          PY

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-trends.json
          git diff --cached --quiet || git commit -m "Update Saudi Google Trends"
          git push
